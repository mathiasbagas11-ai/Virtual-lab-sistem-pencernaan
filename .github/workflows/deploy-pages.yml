name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages harus dinyalakan manual sekali lewat Settings (lihat README).
      # enablement: true tidak bisa dipakai di sini: membuat Pages site lewat
      # API butuh izin administration: write, dan GITHUB_TOKEN tidak pernah
      # mendapat izin itu, sehingga langkahnya gagal dengan
      # "Create Pages site failed. Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
